plugins {
    id 'base'
}

description = 'Experimental NWClient multi-project developer workspace'

// Ensure Windows default charset does not corrupt UTF-8 Java source files.
// The original projects remain independent; this setting applies only when
// compiling them through the unified workspace.
subprojects {
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}

tasks.register('devClasses') {
    group = 'nwclient dev'
    description = 'Incrementally compile Cosmetics, Runtime and their dependencies'
    dependsOn(':Cosmetics:classes', ':MinecraftApi.Runtime:classes')
}

tasks.register('devBuild') {
    group = 'nwclient dev'
    description = 'Build NWClient projects using their existing Gradle tasks'
    dependsOn(':LaunchLinker:build', ':MinecraftApi:build', ':MinecraftApi.Runtime:build', ':Cosmetics:build')
}

// Launch and deploy remain separate until their native runtime configuration
// and credentials can be handled safely.
